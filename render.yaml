# Render Blueprint — tek tiklamayla kurulum.
#
# Render'in ucretsiz katmani secildi cunku: gercek bir HTTPS adresi
# veriyor (iyzico callback'i icin ngrok tuneline gerek kalmiyor), Docker
# imajini dogrudan calistiriyor ve yonetilen Postgres sunuyor.
#
# --- UCRETSIZ KATMANIN GERCEK SINIRLARI -------------------------------
#
# 1. Servis on bes dakika istek almazsa UYUYOR; ilk istek ~1 dakika
#    bekliyor. Demoyu gostermeden once bir kez acmak yeterli.
#
# 2. Dosya sistemi GECICI ve KALICI DISK YOK — disk yalnizca ucretli
#    servislerde. Bunun iki sonucu var ve ikisi de ele alindi:
#
#    a) Data Protection anahtarlari artik VERITABANINDA (bkz.
#       Loca.Persistence.DependencyInjection). Diskte kalsalardi her
#       uyanista yenisi uretilir ve panelden girilmis iyzico anahtarlariyla
#       SMTP sifresi cozulemez hale gelirdi. Cozulemeyen sir "tanimli
#       degil" sayildigi icin uygulama cokmez — hata SESSIZ olurdu.
#       Bu yuzden Storage__Path ve DataProtection__KeyPath BILEREK
#       verilmiyor.
#
#    b) YUKLENEN DOSYALAR HER DAGITIMDA SILINIYOR. Afisler ve sahne
#       sozlesmeleri kaybolur; katalog gorselleri icin dagitim sonrasi
#       tools/demo-veri/afisleri_yenile.py yeniden kosulmali. Kalici
#       cozum nesne deposu (S3/R2) ya da ucretli disk.
#
# 3. Ucretsiz Postgres olusturulduktan 30 GUN SONRA suresi doluyor;
#    silinmeden once 14 gun yukseltme suresi var. Uzun sure ayakta
#    kalacaksa ucretli katman ya da duzenli pg_dump gerekiyor.
#
# 4. SMTP portlari (25, 465, 587) DISARI KAPALI. Sifre sifirlama ve bilet
#    postasi ucretsiz katmanda GITMEZ; yonetici hesabi acildiginda ekran
#    "posta gonderilemedi" diyor ve baglantiyi elle iletmek gerekiyor.
#    HTTP tabanli bir posta saglayicisi (Resend, SendGrid API) bu sinirin
#    disinda kalir.
#
# 5. CALISMA ALANI BASINA TEK UCRETSIZ POSTGRES. Blueprint'in kendi
#    veritabanini olusturmasi bu yuzden KALDIRILDI: workspace'te zaten
#    baska bir ucretsiz veritabani varsa kurulum "cannot have more than
#    one active free tier database" ile dusuyor ve web servisi de iptal
#    oluyor.
#
#    DATABASE_URL artik ELLE giriliyor. Var olan veritabani paylasilabilir:
#    Loca'nin tablolari EF ile olusuyor ve kendi gec kaydini
#    (__EFMigrationsHistory) tutuyor, baska bir aracin (ornegin Prisma)
#    tablolariyla cakismiyor. Ayri bir veritabani isteniyorsa eski olan
#    silinip asagidaki blok geri acilabilir:
#
#      databases:
#        - name: loca-postgres
#          databaseName: loca
#          user: loca_user
#          plan: free
#
# Kurulum: Render panelinde New → Blueprint, depoyu sec. Asagidaki
# degiskenlerden sync:false olanlar ELLE giriliyor (panel soruyor);
# gerisi otomatik.
#
# Adim adim kilavuz: docs/06-canliya-alma.md

services:
  - type: web
    name: loca
    runtime: docker
    plan: free
    # Dal ACIKCA yaziliyor. Belirtilmeseydi Render deponun varsayilan dalini
    # kullanirdi ve bu sessiz bir tuzak: main uzun sure gercek isin 123
    # commit gerisinde durmustu, o hâliyle bir dagitim calisan uygulamayi
    # degil bos iskeleti canliya alirdi.
    branch: main
    # Depo kokundeki tek konteyner imaji: arayuz + API. Ayri servisler
    # kurulsaydi CORS ve ikinci bir alan adi gerekirdi; ucretsiz katmanda
    # ayrica iki servisin ikisini birden uyandirmak gerekirdi.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Veritabani baglanti dizesi. ELLE giriliyor (yukaridaki 5. madde):
      # Render panelinde veritabanini ac → "Internal Database URL" degerini
      # kopyala. Ic adres kullanilmali; dis adres internetten geciyor ve
      # ucretsiz katmanda yavas.
      #
      # Bicim postgres://kullanici:sifre@sunucu/veritabani; uygulama
      # acilista Npgsql bicimine ceviriyor (BarindirmaAyarlari) ve
      # uretimde SSL Mode=Require kullaniyor.
      - key: DATABASE_URL
        sync: false

      # JWT imza anahtari. generateValue: Render rastgele uretiyor ve
      # kimse gormuyor — elle girilen bir anahtar panel gecmisinde ve
      # panoda kalirdi.
      - key: Jwt__Secret
        generateValue: true

      - key: Jwt__Issuer
        value: loca-api
      - key: Jwt__Audience
        value: loca-web

      # Ilk admin hesabi. Sifre ELLE giriliyor: uretilen bir degeri
      # gormeden giris yapilamazdi.
      - key: AdminSeed__Email
        sync: false
      - key: AdminSeed__Password
        sync: false
      - key: AdminSeed__FullName
        value: Loca Yonetici

      # Render'in yonlendiricisi X-Forwarded-For ekliyor. Liste bos
      # kalirsa baslik HIC okunmuyor ve hiz sinirlamasi butun
      # kullanicilari tek istemci sayiyor; kayitsizca okunsaydi istemci
      # kendi IP'sini uydurup siniri tamamen atlatirdi. Render'in ic
      # aginin adres araligi 10.0.0.0/8.
      - key: App__TrustedProxies__0
        value: 10.0.0.0

      # REDIS YOK ve bu bilincli: ucretsiz katmanda ayri bir Redis
      # ornegi servis kotasini tuketiyor. Redis kapaliyken uygulama ayaga
      # kalkiyor, dagitik kilit "degraded" donuyor ve koltuk cakismasi
      # veritabani savunmasiyla (kismi tekil index + eszamanlilik
      # damgasi) engelleniyor — Gun 6'daki katmanli savunma karari tam
      # olarak bunun icindi.
      #
      # Redis eklenirse: REDIS_URL degiskenini tanimlamak yeterli.

      # Odeme SANDBOX'ta kaliyor. Gercek kart icin iyzico uye isyeri
      # basvurusu ve onayi gerekiyor; sartname de gercek odeme
      # saglayicisini kapsam disi birakmis. Sandbox'ta kart bilgisi
      # gercek degil, para hareketi yok.
      #
      # Deger dosyada tutuluyor ki panelde elle yapilmis bir degisiklige
      # bagli kalmasin: acik `value:` tasiyan degiskenler blueprint
      # eslemesinde bu dosyadaki degere cekiliyor.
      #
      # Saglayici ACILISTA seciliyor (Infrastructure/DependencyInjection):
      # secim DI'a bir kez kaydediliyor ve calisma aninda
      # degistirilemiyor — degisiklik ancak yeniden baslatmayla gecerli
      # oluyor. Anahtarlar bunun disinda: panelden giriliyor ve
      # veritabaninda sifreli duruyor, imaja hic girmiyorlar.
      - key: Payment__Provider
        value: Iyzico
      - key: Iyzico__UseSandbox
        value: "true"

      # iyzico anahtarlari ve SMTP panelden giriliyor (Yonetim → Ödeme
      # ayarlari / Posta ayarlari); sifreli saklaniyorlar ve ortam
      # degiskeni olarak durmalari gerekmiyor.
