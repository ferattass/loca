server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip: paketin buyuk kismi metin ve sikistirma boyutu ucte bire
    # indiriyor. Zaten sikistirilmis turler (gorsel, font) disarida —
    # onlari tekrar sikistirmak yalnizca CPU harciyor.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API cagrilari ayni kokten gidiyor: arayuz VITE_API_BASE_URL=/api/v1
    # ile derlendiginde tarayici istegi buraya atiyor ve nginx api
    # konteynerine tasiyor.
    #
    # Bunun yani ARAYUZ ILE API AYNI KOKTE gorunuyor: CORS'a gerek
    # kalmiyor ve tarayici acisindan tek bir site var.
    location /api/ {
        proxy_pass http://api:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Gercek istemci adresi API'ye TASINIYOR. Tasinmasaydi API butun
        # istekleri nginx'ten geliyor sanar, hiz sinirlamasi tek bir
        # istemci gorur ve odeme saglayicisina giden alici IP'si yanlis
        # olurdu. API bu basligi yalnizca App:TrustedProxies listesindeki
        # adresten kabul ediyor.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Yuklenen gorseller de API tarafinda duruyor.
    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Paket dosyalarinin adinda icerik ozeti var (app-a1b2c3.js): icerik
    # degisince ad da degisiyor, bu yuzden uzun onbellek guvenli.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Tek sayfali uygulama: /rezervasyonlarim gibi bir adres diskte dosya
    # olarak yok, yonlendirmeyi tarayicidaki React Router yapiyor. Bu
    # satir olmadan sayfa YENILENDIGINDE 404 gelirdi — ilk girişte
    # calisip yenilemede kirilan, gozden kacmasi kolay bir hata.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html ONBELLEGE ALINMIYOR: paket adlari onun icinde
        # yaziyor. Onbellege alinsaydi tarayici yeni surumden sonra bile
        # eski paketleri istemeye devam ederdi.
        add_header Cache-Control "no-cache";
    }
}
