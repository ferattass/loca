name: loca

# Altyapi servisleri varsayilan olarak acilir:
#   docker compose up -d
#
# API ve web, projeler olusturulduktan sonra "app" profiliyle acilir:
#   docker compose --profile app up -d
# Boylece Dockerfile'lar hazir olmadan da veritabani ve Redis ayakta olur.

services:
  postgres:
    image: postgres:16-alpine
    container_name: loca-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [loca-net]

  redis:
    image: redis:7-alpine
    container_name: loca-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [loca-net]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: loca-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [loca-net]

  redisinsight:
    image: redis/redisinsight:latest
    container_name: loca-redisinsight
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    networks: [loca-net]

  # Yerel e-posta yakalayici. Gercek SMTP kullanilmaz;
  # gonderilen tum postalar http://localhost:8025 arayuzunde birikir.
  mailpit:
    image: axllent/mailpit:latest
    container_name: loca-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks: [loca-net]

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: src/Loca.WebApi/Dockerfile
    container_name: loca-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: ${DB_CONNECTION_STRING}
      ConnectionStrings__Redis: ${REDIS_CONNECTION_STRING}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS}
      AdminSeed__Email: ${ADMIN_EMAIL}
      AdminSeed__Password: ${ADMIN_PASSWORD}
      AdminSeed__FullName: ${ADMIN_FULL_NAME}

      # Anahtar adi Smtp__From DEGIL Smtp__FromAddress: SmtpOptions o adi
      # okuyor. Yanlis ad sessizce yok sayilirdi — gonderen adresi bos
      # kalir, uygulama "SMTP yapilandirilmamis" der ve sebebi burada
      # oldugu hic akla gelmezdi.
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__FromAddress: ${SMTP_FROM}
      Smtp__FromName: Loca

      Storage__Path: /app/uploads

      # Sir ayarlarin sifreleme anahtarlari. Volume'a baglanmasa her
      # yeniden baslatmada yeni anahtar uretilir ve o ana kadar sifreli
      # yazilmis SMTP sifresi cozulemez hâle gelirdi. Uygulama cokmez,
      # sessizce "ayar tanimli degil" der — yani hata gorunmezdi.
      DataProtection__KeyPath: /app/keys

      Reservation__LockMinutes: ${RESERVATION_LOCK_MINUTES}
      Reservation__ExtendMinutes: ${RESERVATION_EXTEND_MINUTES}
      Reservation__MaxSeatsPerUserPerSession: ${MAX_SEATS_PER_USER_PER_SESSION}
      App__BaseUrl: ${APP_BASE_URL}
      App__WebUrl: ${WEB_BASE_URL}

      # Arayuz nginx uzerinden geliyor; gercek istemci adresini o tasiyor.
      # Bu liste bos birakilsaydi X-Forwarded-For hic okunmaz, API butun
      # istekleri nginx'ten geliyor sanardi.
      App__TrustedProxies__0: ${WEB_PROXY_IP}
    ports:
      - "5000:8080"
    volumes:
      - uploads:/app/uploads
      - dpkeys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [loca-net]

  web:
    profiles: [app]
    build:
      context: ./web
      args:
        # Vite ortam degiskenlerini paket icine YAZIYOR; calisma aninda
        # okunamiyorlar. Bu yuzden adres derleme argumani olarak veriliyor.
        #
        # Deger "/api/v1" — mutlak adres degil. Arayuz istegi kendi
        # kokune atiyor, nginx api konteynerine tasiyor; boylece arayuz
        # ile API tarayici acisindan AYNI SITE oluyor ve CORS'a gerek
        # kalmiyor.
        VITE_API_BASE_URL: /api/v1
    container_name: loca-web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [loca-net]

volumes:
  pgdata:
  redisdata:
  uploads:
  dpkeys:

networks:
  loca-net:
    driver: bridge
